<!DOCTYPE html>
<html>
<head>
<title>LIVE6D – 756 Achsen</title>
<meta charset="utf-8">
<style>
body { font-family: Arial; background:#111; color:#eee; }
.axis { padding:4px; margin:2px; background:#222; border-radius:4px; }
</style>
</head>
<body>

<h1>LIVE6D – 756 Achsen Index</h1>
<div id="axes"></div>

<script>
fetch("axes.json")
  .then(r => r.json())
  .then(data => {
    const div = document.getElementById("axes");
    data.forEach(a => {
      const d = document.createElement("div");
      d.className = "axis";
      d.textContent = `${a.id} – ${a.name}`;
      div.appendChild(d);
    });
  });
</script>

</body>
</html>
