<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>LIVE6D · 756 Achsen · High‑Gloss Index</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  body {
    background:#000;
    color:#7dd3fc;
    font-family:monospace;
    margin:0;
    overflow:hidden;
  }

  #grid {
    position:fixed;
    top:60px; left:0; right:0; bottom:0;
    display:grid;
    grid-template-columns:repeat(27, 1fr);
    grid-template-rows:repeat(28, 1fr);
    gap:3px;
    padding:10px;
  }

  .cell {
    border:1px solid #1f2937;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:14px;
    cursor:pointer;
    transition:transform .3s ease, background .3s ease;
  }

  .cell:hover {
    background:#12263a;
    transform:scale(1.08);
  }

  #panel {
    position:fixed;
    right:0;
    top:0;
    width:360px;
    height:100%;
    background:#0b1220;
    border-left:2px solid #7dd3fc;
    padding:20px;
    overflow:auto;
  }

  #panel h2 {
    color:#aaffcc;
    margin-top:0;
  }

  #panel pre {
    background:#000;
    padding:10px;
    border:1px solid #1f2937;
    color:#66ffaa;
    font-size:12px;
  }

  #btn-top {
    position:fixed;
    top:0; left:0; right:360px;
    height:60px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    background:#000;
    border-bottom:2px solid #7dd3fc;
  }

  .btn {
    background:#0b1220;
    color:#7dd3fc;
    border:1px solid #1f2937;
    padding:8px 12px;
    font-size:14px;
    cursor:pointer;
    border-radius:6px;
    transition:.2s;
  }

  .btn:hover {
    background:#12263a;
    transform:scale(1.05);
  }
</style>
</head>

<body>

<div id="btn-top">
  <button class="btn" onclick="resetGrid()">Reset</button>
  <button class="btn" onclick="colorDiag()">Diagonal</button>
  <button class="btn" onclick="colorModules()">Module</button>
</div>

<div id="grid"></div>

<div id="panel">
  <h2>Achse Info</h2>
  <div id="axis-info">Wähle eine Achse…</div>

  <h2>Diagonal</h2>
  <div id="diag-info"></div>

  <h2>Module</h2>
  <pre id="module-info"></pre>
</div>

<script>
let AXES = [];
let DIAG = [];
let MODULES = {};

Promise.all([
  fetch("axes.json").then(r=>r.json()),
  fetch("diagonal.json").then(r=>r.json()),
  fetch("modules.json").then(r=>r.json())
]).then(([axes, diag, modules]) => {
  AXES = axes;
  DIAG = diag;
  MODULES = modules;
  buildGrid();
});

const grid = document.getElementById("grid");
const cells = [];

function buildGrid(){
  for(let i=0;i<756;i++){
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.textContent = AXES[i].id;

    cell.onclick = () => showAxis(i);

    grid.appendChild(cell);
    cells.push(cell);
  }
}

function showAxis(i){
  document.getElementById("axis-info").textContent =
    `${AXES[i].id} – ${AXES[i].name}`;

  document.getElementById("diag-info").textContent =
    `Diagonal: ${DIAG[i].diag}`;

  let out = "";
  for(const file in MODULES){
    out += `# ${file}\n`;
    out += JSON.stringify(MODULES[file][i % MODULES[file].length], null, 2);
    out += "\n\n";
  }
  document.getElementById("module-info").textContent = out;
}

function resetGrid(){
  cells.forEach(c=>{
    c.style.background="transparent";
    c.style.transform="rotate(0deg)";
  });
}

function colorDiag(){
  cells.forEach((c,i)=>{
    const d = DIAG[i].diag;
    const col = "#" + ((d*37)%16777215).toString(16);
    c.style.background = col;
  });
}

function colorModules(){
  cells.forEach((c,i)=>{
    const col = "#" + ((i*123)%16777215).toString(16);
    c.style.background = col;
  });
}
</script>

</body>
</html>
